name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Create placeholder assets/.env
        run: |
          mkdir -p assets
          touch assets/.env

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate localization files
        run: bash tools/l10n/build.sh

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Analyze mwl-api
        run: |
          cd mwl-api
          dart pub get
          dart analyze .

      - name: Run Flutter tests
        run: flutter test --no-pub
